name: BodyMake 12 v1.0.2 cache hotfix
on:
  push:
    paths:
      - '.github/workflows/cache-hotfix-v102.yml'
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cache and asset versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('href="app.css"','href="app.css?v=1.0.2"')
          s=s.replace('src="app1.js"','src="app1.js?v=1.0.2"')
          s=s.replace('src="app2.js"','src="app2.js?v=1.0.2"')
          s=s.replace('src="app3.js"','src="app3.js?v=1.0.2"')
          s=s.replace('BodyMake 12 v1.0.0','BodyMake 12 v1.0.2').replace('BodyMake 12 v1.0.1','BodyMake 12 v1.0.2')
          p.write_text(s)

          p=Path('app1.js')
          s=p.read_text().replace("const APP_VERSION='1.0.1'","const APP_VERSION='1.0.2'")
          p.write_text(s)

          p=Path('sw.js')
          s=p.read_text()
          s=s.replace("const CACHE='bodymake12-v1.0.1'","const CACHE='bodymake12-v1.0.2'")
          old="const CORE=['./','./index.html','./app.css','./app1.js','./app2.js','./app3.js','./manifest.webmanifest','./icon-192.png','./icon-512.png','./privacy.html','./terms.html'];"
          new="const CORE=['./','./index.html','./app.css?v=1.0.2','./app1.js?v=1.0.2','./app2.js?v=1.0.2','./app3.js?v=1.0.2','./manifest.webmanifest','./icon-192.png','./icon-512.png','./privacy.html','./terms.html'];"
          if old in s: s=s.replace(old,new)
          p.write_text(s)

          Path('VERSION.txt').write_text('1.0.2\n')
          PY
      - name: Commit hotfix
        run: |
          git config user.name "BodyMake Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html app1.js sw.js VERSION.txt
          git commit -m "Fix stale PWA cache and mixed-version startup crash" || exit 0
          git push
